services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense_claims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense"]
      interval: 2s
      retries: 15

  # Hot tier object store. Active claims live here; the paid-cache/ prefix
  # holds post-payment copies that the app's lifecycle rule expires after
  # PAID_CACHE_DAYS. The S3 cold archive is real AWS, so it is NOT in compose.
  minio:
    # The upstream minio/minio Docker Hub image was retired. Chainguard
    # publishes the compatible MinIO server image for local development.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
